name: cadence
description: Cadence — PCOS care companion, cycle-aware symptom tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  intl: ^0.20.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  cloud_firestore: ^6.8.0
  local_auth: ^3.0.2
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.1
  flutter_timezone: ^5.1.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/cadence.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/cadence.png"
  adaptive_icon_background: "#F7EFE7"
  adaptive_icon_foreground: "assets/images/cadence.png"
